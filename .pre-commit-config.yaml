repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        language: system
        entry: uv run mypy
        args: [src/scraper]
        pass_filenames: false

      - id: pytest
        name: pytest
        language: system
        entry: uv run pytest
        args: [-x, -q, -m, "not network and not slow"]
        pass_filenames: false

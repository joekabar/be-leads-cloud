# Supplements to lib/postcodes.toml, which is the authoritative postcode source.
#
# This file used to carry a second, curated postcode list per city that OVERRODE
# postcodes.toml. The two drifted badly and the override was the worse of the
# pair: an audit against the KBO registry found 13 of 15 curated cities wrong,
# in two ways.
#
#   Missing codes  -- brugge lacked 8310 and 8380 (Assebroek, Sint-Kruis,
#                     Zeebrugge, Lissewege, Dudzele), making ~30% of the city
#                     unreachable; namur lacked 5100/5101 (9,101 entities);
#                     mons, charleroi and antwerpen were likewise short.
#   Extra codes    -- brugge included 8020 (Oostkamp), kortrijk included Kuurne,
#                     Harelbeke, Deerlijk, Zwevegem and Wevelgem, mechelen
#                     included Boom and Willebroek, and so on. Those companies
#                     were scraped and exported as if they were in the city.
#
# So the precedence is inverted: postcodes.toml wins, and this file may only
# ADD cities that postcodes.toml does not define, or declare aliases. Two
# competing lists for one city is the bug, not the fix.
#
# Add a city here only when it is genuinely absent from postcodes.toml:
#
#   [some-city]
#   postal_codes = ["1234", "5678"]

# ---------------------------------------------------------------------------
# Aliases: alternative spellings that resolve to one canonical slug.
#
# These used to be duplicate entries holding a copy of the same postcode list,
# which broke city_for_postal_code(): it drops any code claimed by more than one
# slug rather than guessing, so every Gent, Liege, Mons and Namur postcode had
# two owners and resolved to None. The export's `city` column was therefore
# blank for all four cities. An alias adds no owner, so the reverse lookup works
# and the two spellings can no longer drift apart.
# ---------------------------------------------------------------------------

[ghent]
alias_of = "gent"

[luik]
alias_of = "liege"

[bergen]
alias_of = "mons"

[namen]
alias_of = "namur"

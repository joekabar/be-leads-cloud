[project]
name = "be-leads"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "asyncpg>=0.29",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "pydantic>=2.7",
    "structlog>=24",
    "streamlit>=1.36",
    "pdfplumber>=0.11",
    "tenacity>=9",
    "python-stdnum>=1.20",
    "phonenumbers>=8.13",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "pytest-recording>=0.13",
    "respx>=0.22",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3",
    "playwright>=1.59",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scraper"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "TCH", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = ["--import-mode=importlib", "-ra"]
testpaths = ["tests"]
markers = [
    "network: tests that hit real third-party hosts",
    "slow: long-running tests",
]

[tool.coverage.run]
source = ["src/scraper"]

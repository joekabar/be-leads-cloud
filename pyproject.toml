[project]
name = "be-leads"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "asyncpg>=0.29",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "pydantic>=2.7",
    "structlog>=24",
    "streamlit>=1.36",
    "pdfplumber>=0.11",
    "tenacity>=9",
    "python-stdnum>=1.20",
    "phonenumbers>=8.13",
    "python-dotenv>=1.0",
    "python-whois>=0.9.5",
    "ddgs>=9",
    "rapidfuzz>=3.9",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "pytest-recording>=0.13",
    "respx>=0.22",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3",
    "playwright>=1.59",
]

[project.scripts]
be-leads-migrate = "scraper.db.migrations.runner:cli_main"
be-leads-validate-phone = "scraper.lib.validators.phone:cli_main"
be-leads-ingest-kbo = "scraper.sources.kbo_dump.cli:cli_main"
be-leads-validate-kbo = "scraper.sources.kbo_dump.cli:cli_validate"
be-leads-fetch-kbopub = "scraper.sources.kbopub_html.cli:cli_main"
be-leads-fetch-nbb = "scraper.sources.nbb_authentic.cli:cli_main"
be-leads-discover-goudengids = "scraper.sources.goudengids.cli:cli_main"
be-leads-enrich-website = "scraper.sources.website.cli:cli_main"
be-leads-search-validate = "scraper.sources.ddg_brave.cli:cli_main"
be-leads-pipeline = "scraper.pipeline.cli:cli_main"
be-leads-kbo-stage = "scraper.sources.kbo_dump.stage_cli:cli_main"
be-leads-cleanup-stage = "scraper.sources.kbo_dump.cleanup_cli:cli_main"
be-leads-pipeline-batch = "scraper.pipeline.batch_cli:cli_main"
be-leads-next-sectors = "scraper.pipeline.sector_queue_cli:cli_main"
be-leads-next-city = "scraper.pipeline.next_city_cli:cli_main"
be-leads-suppress = "scraper.db.suppress_cli:cli_main"
be-leads-export = "scraper.ui.export:cli_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scraper"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "TCH", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
# S108 (/tmp paths): tests assert on literal path strings for argument parsing; nothing
# is written there. Real temp files use pytest's tmp_path fixture.
"tests/**" = ["S101", "S108", "TC002", "TC003", "S603", "S607", "S608"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["ddgs", "ddgs.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["rapidfuzz", "rapidfuzz.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["streamlit", "streamlit.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = ["--import-mode=importlib", "-ra"]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "network: tests that hit real third-party hosts",
    "slow: long-running tests",
    "integration: tests that require a real Postgres instance",
]

[tool.coverage.run]
source = ["src/scraper"]
omit = ["*/archive/*"]
